spring:
  application:
    name: drift-api
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
  datasource:
    # AUTO_SERVER lets a second process share the same file DB instead of
    # failing with a lock error (incompatible with DB_CLOSE_ON_EXIT).
    url: jdbc:h2:file:./data/drift;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

drift:
  etl:
    on-startup: true
  # comma-separated allowed origins (set DRIFT_CORS_ORIGINS to your frontend URL in prod)
  cors-origins: ${DRIFT_CORS_ORIGINS:*}
